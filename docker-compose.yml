version: '3.8'

services:
  smartsupply-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartsupply-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-smartsupply_secret_jwt_key_2026}
    env_file:
      - .env
